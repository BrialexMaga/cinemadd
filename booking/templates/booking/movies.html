<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening Movies</title>
</head>
<body>

    {% for movie in movies %}
        <h2>{{ movie.name }}</h2> <h3>Duration: {{ movie.duration_seconds }} seconds</h3>
        <ul>
        {% for screening in movie.screening_set.all %}
            <li>Room {{ screening.room.number }} - {{ screening.start_time }}</li>
        {% endfor %}
        </ul>
    {% endfor %}

</body>
</html>
