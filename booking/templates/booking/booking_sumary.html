{% extends "base.html" %}

{% block title %}Screening Movies{% endblock %}

{% block content %}
<main>
    <h1>Booking Sumary</h1>
    <h2> {{ booking.id }} </h2>
    <ul>
        {% for seat in seats %}
        <li>{{ seat.screening_seat }}</li>
        {% endfor %}
    </ul>
    <a href="{% url 'booking:movie-list' %}"><button>Return to movies</button></a>
</main>
{% endblock content %}
